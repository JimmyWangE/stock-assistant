name: finance

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://finance:${POSTGRES_PASSWORD}@db:5432/finance
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:?请在 .env 中设置 LLM_BASE_URL}
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-200}
    secrets:
      - llm_api_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

secrets:
  # 模型密钥只以只读文件挂进后端容器，不写进镜像、环境变量或代码仓库
  llm_api_key:
    file: ${LLM_API_KEY_FILE:?请在 .env 中设置 LLM_API_KEY_FILE}

volumes:
  pgdata:
